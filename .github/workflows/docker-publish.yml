name: Publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (tag or branch)"
        required: true
      version:
        description: "Image version tag, without the leading v (e.g. 2.1.0)"
        required: true

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    # Native Arm runners build the Arm images without QEMU
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        target: [runner, runner-nonroot]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - target: runner
            suffix: ""
          - target: runner-nonroot
            suffix: "-nonroot"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}${{ matrix.suffix }}-${{ matrix.arch }}

  merge:
    name: Publish ${{ matrix.target }} manifest
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - target: runner
            suffix: ""
          - target: runner-nonroot
            suffix: "-nonroot"
    steps:
      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifests
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          SRC="${IMAGE}:${{ steps.image.outputs.version }}${{ matrix.suffix }}"
          for tag in "${{ steps.image.outputs.version }}${{ matrix.suffix }}" "latest${{ matrix.suffix }}"; do
            docker buildx imagetools create -t "${IMAGE}:${tag}" "${SRC}-amd64" "${SRC}-arm64"
          done

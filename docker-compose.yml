# Copy config.example.json to config.json next to this file, adjust it if
# needed, then run: docker compose up -d
services:
  local-gpss:
    # Runs as an unprivileged user (uid 10001, or any uid with gid 0, as on
    # OpenShift). Use :latest instead if you need the image to run as root.
    image: ghcr.io/flagbrew/local-gpss:latest-nonroot
    restart: unless-stopped
    # The app only writes to /data (database) and /tmp (large uploads)
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json
      - gpss-data:/data

volumes:
  gpss-data:
